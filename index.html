<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Troop Training Planner V10</title>
<style>
body{font-family:system-ui,Arial;background:#0f172a;color:#fff;max-width:1000px;margin:auto;padding:16px}
.card{background:#1e293b;border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{padding:10px;border:none;border-radius:8px}
.num{width:70px;text-align:center}
button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer}
.active{outline:3px solid #22c55e}
.good{color:#22c55e;font-weight:bold}
.warn{color:#f59e0b;font-weight:bold}
h1{text-align:center}
</style>
</head>
<body>

<h1>Troop Training Planner V10</h1>

<div class="card">
<div><b>Local Time:</b> <span id="local"></span></div>
<div><b>UTC Time:</b> <span id="utc"></span></div>
<div><b>Next UTC Reset:</b> <span id="reset"></span></div>
</div>

<div class="card">
<h2>Training Duration</h2>
<div class="row">
Days <input id="d" class="num" type="number" value="0" min="0">
Hours <input id="h" class="num" type="number" value="0" min="0">
Minutes <input id="m" class="num" type="number" value="0" min="0">
Seconds <input id="s" class="num" type="number" value="0" min="0">
</div>
</div>

<div class="card">
<button id="localBtn">LOCAL</button>
<button id="utcBtn">UTC</button>
</div>

<div class="card" id="results"></div>

<script>
let mode="local";

function nextReset(){
 const r=new Date();
 r.setUTCHours(24,0,0,0);
 return r;
}

function fmt(dt){
 return mode==="utc" ? dt.toUTCString() : dt.toLocaleString();
}

function updateHeader(){
 const now=new Date();
 local.textContent=now.toLocaleString();
 utc.textContent=now.toUTCString();

 const diff=nextReset()-now;
 reset.textContent=
 `${Math.floor(diff/3600000)}h ${Math.floor((diff%3600000)/60000)}m ${Math.floor((diff%60000)/1000)}s`;
}

function calc(){

 const duration =
 (((((+d.value||0)*24)+(+h.value||0))*60+(+m.value||0))*60+(+s.value||0))*1000;

 const now=new Date();

 const finishIfStartedNow=new Date(now.getTime()+duration);

 let desiredFinish=null;
 let beginTraining=null;
 let countdown="";
 let status="";

 if(finishDate.value){
   desiredFinish=new Date(finishDate.value+"T"+(finishTime.value||"00:00")+":00Z");
   beginTraining=new Date(desiredFinish.getTime()-duration);

   const wait=beginTraining-now;

   if(wait>0){
      countdown=`${Math.floor(wait/86400000)}d ${Math.floor((wait%86400000)/3600000)}h ${Math.floor((wait%3600000)/60000)}m ${Math.floor((wait%60000)/1000)}s`;
      status='<div class="good">WAIT TO START</div>';
   }else{
      countdown='0d 0h 0m 0s';
      status='<div class="warn">START NOW</div>';
   }
 }

 results.innerHTML=`
 <h2>Start Now Calculation</h2>
 <p><b>Current Time</b><br>${fmt(now)}</p>
 <p><b>Troops Finish If Started Now</b><br>${fmt(finishIfStartedNow)}</p>

 <hr>
 `;
}

localBtn.onclick=()=>{mode="local";localBtn.classList.add("active");utcBtn.classList.remove("active");calc();};
utcBtn.onclick=()=>{mode="utc";utcBtn.classList.add("active");localBtn.classList.remove("active");calc();};

document.querySelectorAll("input").forEach(i=>i.addEventListener("input",calc));

const r=new Date(); r.setUTCHours(24,0,0,0);
finishDate.value=r.toISOString().slice(0,10);

localBtn.classList.add("active");

setInterval(()=>{updateHeader();calc();},1000);
updateHeader();
calc();
</script>

</body>
</html>
