<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Troop Training Planner</title>

<style>
body{
font-family:system-ui,Arial,sans-serif;
background:#0f172a;
color:white;
max-width:900px;
margin:auto;
padding:16px;
}

.card{
background:#1e293b;
border-radius:16px;
padding:20px;
margin:12px 0;
}

h1{
text-align:center;
}

input{
padding:12px;
border:none;
border-radius:10px;
font-size:18px;
width:90px;
text-align:center;
}

input[type="datetime-local"]{
width:100%;
max-width:350px;
}

button{
padding:14px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.toggle{
width:120px;
margin-right:10px;
}

.active{
background:#22c55e;
color:white;
}

.good{
color:#22c55e;
font-weight:bold;
font-size:24px;
}

.warn{
color:#f59e0b;
font-weight:bold;
font-size:24px;
}

.bad{
color:#ef4444;
font-weight:bold;
font-size:24px;
}

.row{
display:flex;
gap:12px;
flex-wrap:wrap;
align-items:center;
}
</style>
</head>

<body>

<h1>Troop Training Planner</h1>

<div class="card">
<div><b>Local Time:</b> <span id="localTime"></span></div>
<div><b>UTC Time:</b> <span id="utcTime"></span></div>
</div>

<div class="card">

<h2>Training Duration</h2>

<div class="row">

<div>
<div>Days</div>
<input id="days" value="0">
</div>

<div>
<div>Hours</div>
<input id="hours" value="0">
</div>

<div>
<div>Minutes</div>
<input id="minutes" value="0">
</div>

<div>
<div>Seconds</div>
<input id="seconds" value="0">
</div>

</div>

</div>

<div class="card">

<h2>Troops Must Finish At (UTC)</h2>

<input type="datetime-local" id="target">

</div>

<div class="card">

<h2>Display Mode</h2>

<button id="localBtn" class="toggle active" onclick="setMode('local')">
LOCAL
</button>

<button id="utcBtn" class="toggle" onclick="setMode('utc')">
UTC
</button>

</div>

<div class="card">

<button style="width:100%;" onclick="calculate()">
CALCULATE START TIME
</button>

</div>

<div class="card" id="results">

Waiting for calculation...

</div>

<script>

let displayMode="local";

function setMode(mode){

displayMode=mode;

document.getElementById("localBtn").classList.remove("active");
document.getElementById("utcBtn").classList.remove("active");

if(mode==="local"){
document.getElementById("localBtn").classList.add("active");
}else{
document.getElementById("utcBtn").classList.add("active");
}

calculate();
}

function formatDate(date){

if(displayMode==="utc"){
return date.toUTCString();
}

return date.toLocaleString();
}

function updateClock(){

const now=new Date();

document.getElementById("localTime").textContent=
now.toLocaleString();

document.getElementById("utcTime").textContent=
now.toUTCString();

calculate();
}

setInterval(updateClock,1000);

function calculate(){

const d=Number(document.getElementById("days").value)||0;
const h=Number(document.getElementById("hours").value)||0;
const m=Number(document.getElementById("minutes").value)||0;
const s=Number(document.getElementById("seconds").value)||0;

const targetInput=
document.getElementById("target").value;

if(!targetInput){
return;
}

const target=
new Date(targetInput);

const duration=
((((d*24+h)*60+m)*60+s)*1000);

const start=
new Date(target.getTime()-duration);

const now=
new Date();

const wait=
start-now;

let status="";
let css="";

if(wait>0){

const daysLeft=Math.floor(wait/86400000);
const hoursLeft=Math.floor((wait%86400000)/3600000);
const minsLeft=Math.floor((wait%3600000)/60000);
const secsLeft=Math.floor((wait%60000)/1000);

status=`
<div class="good">
WAIT TO START
</div>

<p>
${daysLeft}d
${hoursLeft}h
${minsLeft}m
${secsLeft}s
</p>
`;

}else{

status=`
<div class="bad">
START NOW
</div>
`;

}

document.getElementById("results").innerHTML=`

<h2>Begin Training</h2>

<p>
${formatDate(start)}
</p>

<h2>Troops Finish</h2>

<p>
${formatDate(target)}
</p>

<h2>Countdown To Start</h2>

${status}

`;

}

updateClock();

</script>

</body>
</html>
